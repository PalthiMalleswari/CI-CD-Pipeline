services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookmarkuser
      POSTGRES_PASSWORD: bookmarkuser123
      POSTGRES_DB: bookmarks_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmarkuser -d bookmarks_db"]
      interval: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app                        # live reload — dev only, never in prod
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: django-insecure-2y1v&1*xl_)hsln%p86d@d(#_#ix)-77o_0^owf&t-&ggp1qjc
      DEBUG: "1"
      DATABASE_URL: postgres://bookmarkuser:bookmarkuser123@db:5432/bookmarks_db
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: bookmarks_db
      POSTGRES_USER: bookmarkuser
      POSTGRES_PASSWORD: bookmarkuser123
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy    # waits for the healthcheck, not just for start

volumes:
  pgdata: