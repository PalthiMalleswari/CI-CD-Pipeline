
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookmark Manager</title>

    <link rel="stylesheet" href="{% static 'links/style.css' %}">

</head>

<body>

    <div class="container">

        <header>
            <h1>Bookmark Manager</h1>
            <p>Save and manage your favorite links.</p>
        </header>


        <!-- Add Bookmark Form -->
        <section class="bookmark-form">

            <h2>Add Bookmark</h2>

            <form id="bookmark-form">

                <div class="form-group">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Django Documentation"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="url">URL</label>
                    <input
                        type="url"
                        id="url"
                        name="url"
                        placeholder="https://example.com"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Bookmark
                </button>

            </form>

        </section>


        <!-- Bookmark List -->
        <section class="bookmark-list">

            <div class="section-header">
                <h2>My Bookmarks</h2>
            </div>
