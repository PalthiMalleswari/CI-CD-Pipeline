name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: palthimalleswari/ci-cd-pipeline

# Default permissions
permissions:
  contents: read
  packages: write


jobs:

  # ============================================================
  # 1. LINT
  # ============================================================

  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest

    steps:

      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Lint
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .


  # ============================================================
  # 2. TEST
  # ============================================================

  test:
    name: Tests
    runs-on: ubuntu-latest

    needs: lint

    env:
      POSTGRES_DB: bookmarks_db
      POSTGRES_USER: bookmarkuser
      POSTGRES_PASSWORD: bookmarkuser123
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: bookmarks_db
          POSTGRES_USER: bookmarkuser
          POSTGRES_PASSWORD: bookmarkuser123

        ports:
          - "5432:5432"

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django Checks
        run: |
          python manage.py check

      - name: Missing Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Migrations
        run: |
          python manage.py migrate

      - name: Run Tests
        run: |
          pytest


  # ============================================================
  # 3. BUILD DOCKER IMAGE
  # ============================================================
  # ============================================================
  # 3. BUILD DOCKER IMAGE
  # ============================================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Check out the code
        uses: actions/checkout@v6


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Build the image and load it locally so Trivy can see it
      - name: Build Docker Image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================
      # 4. SECURITY SCAN
      # ========================================================

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      # ========================================================
      # 5. LOGIN TO GHCR
      # ========================================================

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # 6. PUSH IMAGE (FIXED: Swapped raw bash for official action)
      # ========================================================

      - name: Push Docker Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # ========================================================
      # 7. IMAGE INFORMATION
      # ========================================================

      - name: Show Docker Image
        run: |
          docker images