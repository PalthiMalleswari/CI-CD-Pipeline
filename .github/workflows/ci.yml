name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
    - main

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: bookmarks_db
          POSTGRES_USER: bookmarkuser
          POSTGRES_PASSWORD: bookmarkuser123
        ports:
          - 5432:5432
        
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                      # caches your pip downloads automatically

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint
        run: |
          ruff check .

      - name: Check Formatting
        run: |
          ruff format --check .

      - name: Run Migrations
        env:
          POSTGRES_DB: bookmarks_db
          POSTGRES_USER: bookmarkuser
          POSTGRES_PASSWORD: bookmarkuser123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python manage.py migrate


      - name: Run tests
        env:
          POSTGRES_DB: bookmarks_db
          POSTGRES_USER: bookmarkuser
          POSTGRES_PASSWORD: bookmarkuser123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          pytest